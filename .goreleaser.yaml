version: 2
project_name: depbisect

builds:
  - main: ./cmd/depbisect
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github

brews:
  - name: depbisect
    description: "git bisect, but for dependency updates"
    homepage: https://github.com/skyneticist/depbisect
    license: MIT
    repository:
      owner: skyneticist
      name: homebrew-tap
    skip_upload: auto
