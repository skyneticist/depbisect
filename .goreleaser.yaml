version: 2
project_name: depbisect

builds:
  - main: ./cmd/depbisect
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  # Conventional Commit subjects drive the grouping below; release-noise types
  # and merge commits are dropped from the notes.
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "^style:"
      - "^refactor:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

# Homebrew formula publishing is ENABLED (skip_upload: false below). goreleaser
# pushes the generated formula to the skyneticist/homebrew-tap repo using
# HOMEBREW_TAP_GITHUB_TOKEN (the default GITHUB_TOKEN cannot push to other
# repos). Both of these MUST be in place before the next tagged release, or the
# release job fails:
#   1. The skyneticist/homebrew-tap repo exists with an initial commit.
#   2. A fine-grained PAT (contents: read/write on homebrew-tap) is stored as
#      the HOMEBREW_TAP_GITHUB_TOKEN secret (already wired in release.yml).
brews:
  - name: depbisect
    description: "git bisect, but for dependency updates"
    homepage: https://github.com/skyneticist/depbisect
    license: MIT
    repository:
      owner: skyneticist
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: false
    # Generate and install bash/zsh completions from the installed binary, so
    # brew users get tab completion with no rc-file editing. Only the shells
    # `depbisect completion` actually supports are requested.
    extra_install: |
      generate_completions_from_executable(bin/"depbisect", "completion", shells: [:bash, :zsh])

# Scoop (Windows) manifest publishing is ENABLED (skip_upload: false below). It
# pushes to the skyneticist/scoop-bucket repo using SCOOP_BUCKET_GITHUB_TOKEN.
# Both MUST be in place before the next tagged release, or the release job fails:
#   1. The skyneticist/scoop-bucket repo exists with an initial commit.
#   2. A fine-grained PAT (contents: read/write on scoop-bucket) is stored as
#      the SCOOP_BUCKET_GITHUB_TOKEN secret (already wired in release.yml).
scoops:
  - name: depbisect
    description: "git bisect, but for dependency updates"
    homepage: https://github.com/skyneticist/depbisect
    license: MIT
    repository:
      owner: skyneticist
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    skip_upload: false
