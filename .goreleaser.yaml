version: 2
project_name: depbisect

builds:
  - main: ./cmd/depbisect
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github

# The formula is always generated into dist/homebrew/; uploading it requires
# the skyneticist/homebrew-tap repo to exist and a PAT with write access to it
# (the default GITHUB_TOKEN cannot push to other repos). To enable publishing:
#   1. Create the homebrew-tap repo with an initial commit.
#   2. Add a fine-grained PAT (contents: read/write on homebrew-tap) as the
#      HOMEBREW_TAP_GITHUB_TOKEN secret.
#   3. Set skip_upload to false; the token is wired in release.yml.
brews:
  - name: depbisect
    description: "git bisect, but for dependency updates"
    homepage: https://github.com/skyneticist/depbisect
    license: MIT
    repository:
      owner: skyneticist
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: true
