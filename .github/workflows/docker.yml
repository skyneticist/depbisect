name: Docker

# Builds and pushes a multi-arch image to GHCR on tag push. Uses the built-in
# GITHUB_TOKEN (packages: write) — no extra secret needed. It is self-contained
# (compiles from the tagged source), so it runs in parallel with the goreleaser
# release without depending on it.
#
# After the first push, flip the GHCR package to public once (Packages →
# depbisect → Package settings) if you want unauthenticated `docker pull`.
on:
  push:
    # Exact release tags only — never the moving v0 / v0.1 aliases (see move-tags).
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag for the image, e.g. 0.1.1 (leading "v" is allowed)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${{ github.ref_name }}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
