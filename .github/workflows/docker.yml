name: Docker

# Builds and pushes a multi-arch image to GHCR on tag push. Uses the built-in
# GITHUB_TOKEN (packages: write) — no extra secret needed. It is self-contained
# (compiles from the tagged source), so it runs in parallel with the goreleaser
# release without depending on it.
#
# After the first push, flip the GHCR package to public once (Packages →
# depbisect → Package settings) if you want unauthenticated `docker pull`.
on:
  push:
    # Exact release tags only — never the moving v0 / v0.1 aliases (see move-tags).
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag for the image, e.g. 0.1.1 (leading "v" is allowed)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One image per ecosystem (Dockerfile runtime stages). The js variant
        # keeps the unsuffixed version tags and :latest it has always had; the
        # others get a version suffix plus a moving ecosystem alias
        # (ghcr.io/…/depbisect:go, :rust, :python, :php).
        include:
          - target: js
            suffix: ""
            alias: latest
          - target: go
            suffix: "-go"
            alias: go
          - target: rust
            suffix: "-rust"
            alias: rust
          - target: python
            suffix: "-python"
            alias: python
          - target: php
            suffix: "-php"
            alias: php
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${{ github.ref_name }}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}${{ matrix.suffix }}
            # Only tag pushes move the alias (latest/go/rust/python/php); a
            # workflow_dispatch republish of an older version must not
            # re-point it backwards.
            type=raw,value=${{ matrix.alias }},enable=${{ github.event_name == 'push' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.target }}
