name: npm publish

# Publishes the depbisect launcher and its per-platform binary packages to npm
# with provenance (a signed, verifiable link from the published tarballs back to
# this workflow run and commit).
#
# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN. One-time setup:
#   1. Each package must exist once (bootstrap its first version manually).
#   2. On npmjs.com, add a Trusted Publisher to EVERY package (the `depbisect`
#      launcher and each `@depbisect/<platform>`): GitHub Actions, repo
#      skyneticist/depbisect, workflow npm-publish.yml.
# Requires `id-token: write` (below), npm >= 11.5.1, and public packages.

# Triggered on tag push rather than the `release` event: releases created by
# goreleaser using GITHUB_TOKEN do not trigger downstream workflows. This job is
# self-contained (it cross-compiles from the tagged source), so it can run in
# parallel with the goreleaser release job.
on:
  push:
    # Exact release tags only — never the moving v0 / v0.1 aliases (see move-tags).
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 0.1.1 (leading "v" is allowed)
        required: true

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (Trusted Publishing/OIDC needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${{ github.ref_name }}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Build npm packages
        run: node scripts/build-npm.mjs "${{ steps.ver.outputs.version }}"

      - name: Publish platform packages, then the launcher
        # The ./ prefix forces npm to treat each argument as a directory; a
        # bare "npm/depbisect" parses as the GitHub shorthand
        # github.com/npm/depbisect. Provenance requires the repository to be
        # PUBLIC — on a private repo the registry rejects the bundle (E422).
        run: |
          set -euo pipefail
          for dir in ./npm/@depbisect/*/; do
            echo "publishing $dir"
            npm publish "$dir" --provenance --access public
          done
          echo "publishing ./npm/depbisect"
          npm publish ./npm/depbisect --provenance --access public
