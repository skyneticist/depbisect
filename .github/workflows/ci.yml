name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Formatting, vet, and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.20.x", oldstable, stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: go test
        run: go test ./...

  race:
    name: Race detector / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: go test -race
        run: go test -race ./...

  demo:
    name: CLI smoke test against example repo
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Generate simple example repo
        run: ./examples/make-demo.sh
      - name: Build CLI
        run: go build ./cmd/depbisect
      - name: Bisect the simple example repo
        run: |
          ./depbisect run \
            --repo examples/demo/app \
            --base HEAD~1 \
            --runs 3 \
            --report-md depbisect-simple-report.md \
            --report-json depbisect-simple-report.json \
            -- node test.js
      - name: Assert the simple culprit was identified
        run: |
          node -e '
            const r = require("./depbisect-simple-report.json");
            if (r.outcome !== "minimal-set-found" || r.minimalSet.length !== 1 || r.minimalSet[0].name !== "leftpad") {
              console.error("unexpected result:", JSON.stringify({outcome: r.outcome, minimalSet: r.minimalSet}, null, 2));
              process.exit(1);
            }
            console.log("demo verified: culprit =", r.minimalSet[0].name, "reproduced", r.confidence.failures + "/" + r.confidence.runs);
          '
      - name: Generate complex example repo
        run: ./examples/make-demo-complex.sh
      - name: Bisect the complex example repo
        run: |
          ./depbisect run \
            --repo examples/demo-complex/app \
            --base HEAD~1 \
            --runs 3 \
            --report-md depbisect-complex-report.md \
            --report-json depbisect-complex-report.json \
            -- node test.js
      - name: Assert the interacting culprits were identified
        run: |
          node -e '
            const r = require("./depbisect-complex-report.json");
            const expected = ["cache-reader", "cache-writer", "wire-decoder", "wire-encoder", "wire-transport"];
            const actual = r.minimalSet.map((change) => change.name);
            const valid =
              r.outcome === "minimal-set-found" &&
              r.changes.length === 12 &&
              r.confidence.failures === 3 &&
              r.confidence.runs === 3 &&
              JSON.stringify(actual) === JSON.stringify(expected);
            if (!valid) {
              console.error("unexpected result:", JSON.stringify({
                outcome: r.outcome,
                changes: r.changes.length,
                minimalSet: actual,
                confidence: r.confidence
              }, null, 2));
              process.exit(1);
            }
            console.log("complex demo verified:", actual.join(", "), "reproduced 3/3");
          '
      - name: Generate jobs example repo
        run: ./examples/make-demo-jobs.sh
      - name: Bisect the jobs example repo in parallel
        run: |
          ./depbisect run \
            --repo examples/demo-jobs/app \
            --base HEAD~1 \
            --runs 3 \
            --jobs 4 \
            --report-md depbisect-jobs-report.md \
            --report-json depbisect-jobs-report.json \
            -- node test.js
      - name: Assert parallel bisection finds the eight interacting culprits
        run: |
          node -e '
            const r = require("./depbisect-jobs-report.json");
            const expected = [
              "consensus-auth", "consensus-codec", "consensus-gossip", "consensus-ledger",
              "consensus-router", "consensus-session", "consensus-stream", "consensus-sync"
            ];
            const actual = r.minimalSet.map((change) => change.name);
            const valid =
              r.outcome === "minimal-set-found" &&
              r.changes.length === 18 &&
              r.minimalityProven === true &&
              r.confidence.failures === 3 &&
              r.confidence.runs === 3 &&
              JSON.stringify(actual) === JSON.stringify(expected);
            if (!valid) {
              console.error("unexpected result:", JSON.stringify({
                outcome: r.outcome,
                changes: r.changes.length,
                minimalityProven: r.minimalityProven,
                minimalSet: actual,
                confidence: r.confidence
              }, null, 2));
              process.exit(1);
            }
            console.log("jobs demo verified (--jobs 4):", actual.length, "interacting culprits, reproduced 3/3");
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-reports-${{ matrix.os }}
          path: depbisect-*-report.*
          if-no-files-found: ignore

  action-smoke:
    name: Local GitHub Action behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Generate action fixture
        run: ./examples/make-demo.sh
      - name: Action finds the culprit
        id: culprit
        uses: ./
        with:
          base: HEAD~1
          command: node test.js
          working-directory: examples/demo/app
      - name: Assert successful action outputs
        env:
          OUTCOME: ${{ steps.culprit.outputs.outcome }}
          EXIT_CODE: ${{ steps.culprit.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "minimal-set-found"
          test "$EXIT_CODE" = "0"
      - name: Diagnostic CLI outcome does not fail the action
        id: diagnostic
        uses: ./
        with:
          base: HEAD~1
          command: node -e "process.exit(0)"
          working-directory: examples/demo/app
      - name: Assert diagnostic action outputs
        env:
          OUTCOME: ${{ steps.diagnostic.outputs.outcome }}
          EXIT_CODE: ${{ steps.diagnostic.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "not-reproduced"
          test "$EXIT_CODE" = "2"
      - name: Runtime errors fail the action
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          base: HEAD~1
          command: node test.js
          pm: invalid
          working-directory: examples/demo/app
      - name: Assert runtime failure was propagated
        env:
          STEP_OUTCOME: ${{ steps.invalid.outcome }}
        run: test "$STEP_OUTCOME" = "failure"

  docker-smoke:
    name: Docker image behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build the image
        run: docker build -t depbisect:ci .
      - name: Entry point prints usage
        run: docker run --rm depbisect:ci help
      - name: Bundled toolchain is functional
        # depbisect drives git, node, npm and pnpm from inside the image, so a
        # broken one silently defeats the image. pnpm regressed exactly this way
        # once: corepack fetched a release too new for the image's Node and
        # crashed on first use. Invoke each tool so any breakage fails CI.
        run: |
          docker run --rm --entrypoint sh depbisect:ci -eu -c '
            git --version
            node --version
            npm --version
            pnpm --version
          '
      - name: Generate demo fixture
        run: ./examples/make-demo.sh
      - name: Container completes a real bisection and finds the culprit
        # Mount the workspace at its own path so the fixture's absolute file:
        # dependencies resolve inside the container. A clean exit proves install
        # and verification ran; the grep pins the identified culprit.
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" depbisect:ci \
            run --repo "$PWD/examples/demo/app" --base HEAD~1 --runs 3 \
            -- node test.js | tee bisect.log
          grep -q leftpad bisect.log
