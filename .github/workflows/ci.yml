name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # golangci-lint bundles gofmt, go vet, staticcheck, errcheck and more.
      # The enabled set lives in .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vuln:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # Short smoke run; the seed corpora also run as part of the test job.
      # Lengthen -fuzztime, or move to a scheduled workflow, for deeper runs.
      # go.mod/go.sum parsing has no fuzz target by design: it delegates to
      # golang.org/x/mod, which is fuzzed upstream.
      - name: Fuzz ddmin and the manifest parsers
        run: |
          go test -run='^$' -fuzz='^FuzzMinimize$' -fuzztime=30s ./internal/ddmin
          go test -run='^$' -fuzz='^FuzzParsePackageJSON$' -fuzztime=30s ./internal/manifest
          go test -run='^$' -fuzz='^FuzzParsePackageLock$' -fuzztime=30s ./internal/manifest
          go test -run='^$' -fuzz='^FuzzParsePnpmLock$' -fuzztime=30s ./internal/manifest
          go test -run='^$' -fuzz='^FuzzParseCargoToml$' -fuzztime=30s ./internal/manifest
          go test -run='^$' -fuzz='^FuzzParseCargoLock$' -fuzztime=30s ./internal/manifest
          go test -run='^$' -fuzz='^FuzzParsePyproject$' -fuzztime=30s ./internal/manifest
          go test -run='^$' -fuzz='^FuzzParseUvLock$' -fuzztime=30s ./internal/manifest

  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [oldstable, stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: go test
        run: go test ./...

  coverage:
    name: Coverage floor
    # Single OS on purpose: internal/gitx, execx and verify branch on the OS,
    # so per-OS coverage differs by a few tenths. The floor sits a few points
    # below the current level to catch regressions, not freeze the number.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        run: ./scripts/check-coverage.sh coverage.out 80.0

  race:
    name: Race detector / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: go test -race
        run: go test -race ./...

  demo:
    name: CLI smoke test against example repo
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Generate simple example repo
        run: ./examples/make-demo.sh
      - name: Build CLI
        run: go build ./cmd/depbisect
      - name: Bisect the simple example repo
        run: |
          ./depbisect run \
            --repo examples/demo/app \
            --base HEAD~1 \
            --runs 3 \
            --report-md depbisect-simple-report.md \
            --report-json depbisect-simple-report.json \
            -- node test.js
      - name: Assert the simple culprit was identified
        run: |
          node -e '
            const r = require("./depbisect-simple-report.json");
            if (r.outcome !== "minimal-set-found" || r.minimalSet.length !== 1 || r.minimalSet[0].name !== "leftpad") {
              console.error("unexpected result:", JSON.stringify({outcome: r.outcome, minimalSet: r.minimalSet}, null, 2));
              process.exit(1);
            }
            console.log("demo verified: culprit =", r.minimalSet[0].name, "reproduced", r.confidence.failures + "/" + r.confidence.runs);
          '
      - name: Generate complex example repo
        run: ./examples/make-demo-complex.sh
      - name: Bisect the complex example repo
        run: |
          ./depbisect run \
            --repo examples/demo-complex/app \
            --base HEAD~1 \
            --runs 3 \
            --report-md depbisect-complex-report.md \
            --report-json depbisect-complex-report.json \
            -- node test.js
      - name: Assert the interacting culprits were identified
        run: |
          node -e '
            const r = require("./depbisect-complex-report.json");
            const expected = ["cache-reader", "cache-writer", "wire-decoder", "wire-encoder", "wire-transport"];
            const actual = r.minimalSet.map((change) => change.name);
            const valid =
              r.outcome === "minimal-set-found" &&
              r.changes.length === 12 &&
              r.confidence.failures === 3 &&
              r.confidence.runs === 3 &&
              JSON.stringify(actual) === JSON.stringify(expected);
            if (!valid) {
              console.error("unexpected result:", JSON.stringify({
                outcome: r.outcome,
                changes: r.changes.length,
                minimalSet: actual,
                confidence: r.confidence
              }, null, 2));
              process.exit(1);
            }
            console.log("complex demo verified:", actual.join(", "), "reproduced 3/3");
          '
      - name: Generate jobs example repo
        run: ./examples/make-demo-jobs.sh
      - name: Bisect the jobs example repo in parallel
        run: |
          ./depbisect run \
            --repo examples/demo-jobs/app \
            --base HEAD~1 \
            --runs 3 \
            --jobs 4 \
            --report-md depbisect-jobs-report.md \
            --report-json depbisect-jobs-report.json \
            -- node test.js
      - name: Assert parallel bisection finds the eight interacting culprits
        run: |
          node -e '
            const r = require("./depbisect-jobs-report.json");
            const expected = [
              "consensus-auth", "consensus-codec", "consensus-gossip", "consensus-ledger",
              "consensus-router", "consensus-session", "consensus-stream", "consensus-sync"
            ];
            const actual = r.minimalSet.map((change) => change.name);
            const valid =
              r.outcome === "minimal-set-found" &&
              r.changes.length === 18 &&
              r.minimalityProven === true &&
              r.confidence.failures === 3 &&
              r.confidence.runs === 3 &&
              JSON.stringify(actual) === JSON.stringify(expected);
            if (!valid) {
              console.error("unexpected result:", JSON.stringify({
                outcome: r.outcome,
                changes: r.changes.length,
                minimalityProven: r.minimalityProven,
                minimalSet: actual,
                confidence: r.confidence
              }, null, 2));
              process.exit(1);
            }
            console.log("jobs demo verified (--jobs 4):", actual.length, "interacting culprits, reproduced 3/3");
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-reports-${{ matrix.os }}
          path: depbisect-*-report.*
          if-no-files-found: ignore

  windows-smoke:
    name: Windows CLI smoke test against example repo
    # Dedicated Windows e2e. The Linux/macOS `demo` matrix can't simply add
    # windows-latest: its steps assume a POSIX shell, while the Windows runner
    # defaults to PowerShell. This job pins Git Bash (shell: bash, which ships on
    # the runner and honours the .sh demo generators) and runs the built .exe, so
    # the Windows-specific code paths (signals_windows.go, command_windows.go,
    # and git worktree create/reset) get exercised end to end — sequentially and,
    # via --jobs, across concurrent worktrees where Windows file-locking and
    # path-length issues would surface. node is preinstalled on windows-latest,
    # matching the npm demo job's reliance on a preinstalled toolchain.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Generate simple example repo
        run: ./examples/make-demo.sh
      - name: Build CLI (depbisect.exe)
        run: go build -o depbisect.exe ./cmd/depbisect
      - name: Bisect the simple example repo
        run: |
          ./depbisect.exe run \
            --repo examples/demo/app \
            --base HEAD~1 \
            --runs 3 \
            --report-md depbisect-simple-report.md \
            --report-json depbisect-simple-report.json \
            -- node test.js
      - name: Assert the simple culprit was identified
        run: |
          node -e '
            const r = require("./depbisect-simple-report.json");
            if (r.outcome !== "minimal-set-found" || r.minimalSet.length !== 1 || r.minimalSet[0].name !== "leftpad") {
              console.error("unexpected result:", JSON.stringify({outcome: r.outcome, minimalSet: r.minimalSet}, null, 2));
              process.exit(1);
            }
            console.log("windows demo verified: culprit =", r.minimalSet[0].name, "reproduced", r.confidence.failures + "/" + r.confidence.runs);
          '
      - name: Generate jobs example repo
        run: ./examples/make-demo-jobs.sh
      - name: Bisect the jobs example repo in parallel (concurrent worktrees)
        run: |
          ./depbisect.exe run \
            --repo examples/demo-jobs/app \
            --base HEAD~1 \
            --runs 3 \
            --jobs 4 \
            --report-md depbisect-jobs-report.md \
            --report-json depbisect-jobs-report.json \
            -- node test.js
      - name: Assert parallel bisection finds the eight interacting culprits
        run: |
          node -e '
            const r = require("./depbisect-jobs-report.json");
            const expected = [
              "consensus-auth", "consensus-codec", "consensus-gossip", "consensus-ledger",
              "consensus-router", "consensus-session", "consensus-stream", "consensus-sync"
            ];
            const actual = r.minimalSet.map((change) => change.name);
            const valid =
              r.outcome === "minimal-set-found" &&
              r.changes.length === 18 &&
              r.minimalityProven === true &&
              r.confidence.failures === 3 &&
              r.confidence.runs === 3 &&
              JSON.stringify(actual) === JSON.stringify(expected);
            if (!valid) {
              console.error("unexpected result:", JSON.stringify({
                outcome: r.outcome,
                changes: r.changes.length,
                minimalityProven: r.minimalityProven,
                minimalSet: actual,
                confidence: r.confidence
              }, null, 2));
              process.exit(1);
            }
            console.log("windows jobs demo verified (--jobs 4):", actual.length, "interacting culprits, reproduced 3/3");
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke-reports
          path: depbisect-*-report.*
          if-no-files-found: ignore

  demo-cargo:
    name: Cargo CLI smoke test against example repo
    # cargo is preinstalled on GitHub's ubuntu and macos runners, matching the
    # npm demo job's reliance on a preinstalled node. The example repos are
    # fully offline (committed vendored registry), so no crates are downloaded.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Generate simple Cargo example repo
        run: ./examples/make-demo-cargo.sh
      - name: Build CLI
        run: go build ./cmd/depbisect
      - name: Bisect the simple Cargo example repo
        run: |
          ./depbisect run \
            --repo examples/demo-cargo/app \
            --base HEAD~1 \
            --runs 3 \
            --report-json depbisect-cargo-report.json \
            -- cargo test
      - name: Assert the simple culprit was identified
        run: |
          jq -e '.outcome == "minimal-set-found" and .packageManager == "cargo" and (.minimalSet | length) == 1 and .minimalSet[0].name == "breakage"' depbisect-cargo-report.json
      - name: Generate complex Cargo example repo
        run: ./examples/make-demo-cargo-complex.sh
      - name: Bisect the complex Cargo example repo in parallel
        run: |
          ./depbisect run \
            --repo examples/demo-cargo-complex/app \
            --base HEAD~1 \
            --runs 3 \
            --jobs 4 \
            --report-json depbisect-cargo-complex-report.json \
            -- cargo test
      - name: Assert the five interacting culprits were identified
        run: |
          jq -e '.outcome == "minimal-set-found" and (.changes | length) == 12' depbisect-cargo-complex-report.json
          jq -e '[.minimalSet[].name] == ["cache_reader","cache_writer","wire_decoder","wire_encoder","wire_transport"]' depbisect-cargo-complex-report.json
      - name: Generate jobs Cargo example repo
        run: ./examples/make-demo-cargo-jobs.sh
      - name: Bisect the jobs Cargo example repo in parallel
        run: |
          ./depbisect run \
            --repo examples/demo-cargo-jobs/app \
            --base HEAD~1 \
            --runs 3 \
            --jobs 4 \
            --report-json depbisect-cargo-jobs-report.json \
            -- cargo test
      - name: Assert the eight consensus crates were identified
        run: |
          jq -e '.outcome == "minimal-set-found" and (.changes | length) == 18 and (.minimalSet | length) == 8 and ([.minimalSet[].name] | map(startswith("consensus_")) | all)' depbisect-cargo-jobs-report.json
      - name: Generate swarm Cargo example repo
        run: ./examples/make-demo-cargo-swarm.sh
      - name: Bisect the swarm Cargo example repo in parallel
        run: |
          ./depbisect run \
            --repo examples/demo-cargo-swarm/app \
            --base HEAD~1 \
            --runs 3 \
            --jobs 12 \
            --report-json depbisect-cargo-swarm-report.json \
            -- cargo test
      - name: Assert the twelve replica crates were identified
        run: |
          jq -e '.outcome == "minimal-set-found" and (.changes | length) == 28 and (.minimalSet | length) == 12 and ([.minimalSet[].name] | map(startswith("replica_")) | all)' depbisect-cargo-swarm-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-demo-reports-${{ matrix.os }}
          path: depbisect-cargo*-report.json
          if-no-files-found: ignore

  demo-go:
    name: Go CLI smoke test against example repo
    # The example repos are fully offline (generated file:// module proxy with
    # GOSUMDB=off), so no modules are downloaded from the network.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Generate Go example repo
        run: ./examples/make-demo-go.sh
      - name: Build CLI
        run: go build ./cmd/depbisect
      - name: Bisect the Go example repo
        env:
          GOPROXY: file://${{ github.workspace }}/examples/demo-go/proxy
          GOSUMDB: "off"
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: |
          ./depbisect run \
            --repo examples/demo-go/app \
            --base HEAD~1 \
            --runs 3 \
            --report-json depbisect-go-report.json \
            -- go test ./...
      - name: Assert the culprit was identified
        run: |
          jq -e '.outcome == "minimal-set-found" and .packageManager == "go" and (.minimalSet | length) == 1 and .minimalSet[0].name == "example.com/breakage"' depbisect-go-report.json
      - name: Generate complex Go example repo
        run: ./examples/make-demo-go-complex.sh
      - name: Bisect the complex Go example repo in parallel
        env:
          GOPROXY: file://${{ github.workspace }}/examples/demo-go-complex/proxy
          GOSUMDB: "off"
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: |
          ./depbisect run \
            --repo examples/demo-go-complex/app \
            --base HEAD~1 \
            --runs 3 \
            --jobs 4 \
            --report-json depbisect-go-complex-report.json \
            -- go test ./...
      - name: Assert the five interacting culprits were identified
        run: |
          jq -e '.outcome == "minimal-set-found" and (.changes | length) == 12' depbisect-go-complex-report.json
          jq -e '[.minimalSet[].name] == ["example.com/cache-reader","example.com/cache-writer","example.com/wire-decoder","example.com/wire-encoder","example.com/wire-transport"]' depbisect-go-complex-report.json
      - name: Generate jobs Go example repo
        run: ./examples/make-demo-go-jobs.sh
      - name: Bisect the jobs Go example repo in parallel
        env:
          GOPROXY: file://${{ github.workspace }}/examples/demo-go-jobs/proxy
          GOSUMDB: "off"
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: |
          ./depbisect run \
            --repo examples/demo-go-jobs/app \
            --base HEAD~1 \
            --runs 3 \
            --jobs 4 \
            --report-json depbisect-go-jobs-report.json \
            -- go test ./...
      - name: Assert the eight consensus modules were identified
        run: |
          jq -e '.outcome == "minimal-set-found" and (.changes | length) == 18 and (.minimalSet | length) == 8 and ([.minimalSet[].name] | map(startswith("example.com/consensus-")) | all)' depbisect-go-jobs-report.json
      - name: Generate swarm Go example repo
        run: ./examples/make-demo-go-swarm.sh
      - name: Bisect the swarm Go example repo in parallel
        env:
          GOPROXY: file://${{ github.workspace }}/examples/demo-go-swarm/proxy
          GOSUMDB: "off"
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: |
          ./depbisect run \
            --repo examples/demo-go-swarm/app \
            --base HEAD~1 \
            --runs 3 \
            --jobs 12 \
            --report-json depbisect-go-swarm-report.json \
            -- go test ./...
      - name: Assert the twelve replica modules were identified
        run: |
          jq -e '.outcome == "minimal-set-found" and (.changes | length) == 28 and (.minimalSet | length) == 12 and ([.minimalSet[].name] | map(startswith("example.com/replica-")) | all)' depbisect-go-swarm-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-demo-reports-${{ matrix.os }}
          path: depbisect-go*-report.json
          if-no-files-found: ignore

  demo-python:
    name: Python (uv) CLI smoke test against example repo
    # uv is installed via setup-uv and a Python interpreter via setup-python.
    # The example repo is fully offline (committed wheels + a uv.toml with
    # offline/no-index/find-links), so no packages are downloaded during the
    # bisection, matching the cargo and go demo jobs.
    env:
      # Offline uv must use the setup-python interpreter and never try to
      # download a managed one, which would fail with no network.
      UV_PYTHON_PREFERENCE: only-system
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          # The example repo is generated after checkout and installs from
          # committed offline wheels, so there's no dependency file to key a
          # cache on and nothing worth caching. Disabling it silences setup-uv's
          # "no file matched / cache will never get invalidated" warning.
          enable-cache: false
      - name: Generate Python example repo
        run: ./examples/make-demo-python.sh
      - name: Build CLI
        run: go build ./cmd/depbisect
      - name: Bisect the Python example repo
        run: |
          ./depbisect run \
            --repo examples/demo-python/app \
            --base HEAD~1 \
            --runs 3 \
            --report-json depbisect-python-report.json \
            -- uv run -- python check.py
      - name: Assert the culprit was identified
        run: |
          jq -e '.outcome == "minimal-set-found" and .packageManager == "uv" and (.minimalSet | length) == 1 and .minimalSet[0].name == "breakage"' depbisect-python-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-demo-reports-${{ matrix.os }}
          path: depbisect-python*-report.json
          if-no-files-found: ignore

  action-smoke:
    name: Local GitHub Action behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Generate action fixture
        run: ./examples/make-demo.sh
      - name: Action finds the culprit
        id: culprit
        uses: ./
        with:
          base: HEAD~1
          command: node test.js
          working-directory: examples/demo/app
      - name: Assert successful action outputs
        env:
          OUTCOME: ${{ steps.culprit.outputs.outcome }}
          EXIT_CODE: ${{ steps.culprit.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "minimal-set-found"
          test "$EXIT_CODE" = "0"
      - name: Diagnostic CLI outcome does not fail the action
        id: diagnostic
        uses: ./
        with:
          base: HEAD~1
          command: node -e "process.exit(0)"
          working-directory: examples/demo/app
      - name: Assert diagnostic action outputs
        env:
          OUTCOME: ${{ steps.diagnostic.outputs.outcome }}
          EXIT_CODE: ${{ steps.diagnostic.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "not-reproduced"
          test "$EXIT_CODE" = "2"
      - name: Runtime errors fail the action
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          base: HEAD~1
          command: node test.js
          pm: invalid
          working-directory: examples/demo/app
      - name: Assert runtime failure was propagated
        env:
          STEP_OUTCOME: ${{ steps.invalid.outcome }}
        run: test "$STEP_OUTCOME" = "failure"

  docker-smoke:
    name: Docker image behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t depbisect:ci .
      - name: Entry point prints usage
        run: docker run --rm depbisect:ci help
      - name: Bundled toolchain is functional
        # depbisect drives git, node, npm and pnpm from inside the image, so a
        # broken one silently defeats the image. pnpm regressed exactly this way
        # once: corepack fetched a release too new for the image's Node and
        # crashed on first use. Invoke each tool so any breakage fails CI.
        run: |
          docker run --rm --entrypoint sh depbisect:ci -eu -c '
            git --version
            node --version
            npm --version
            pnpm --version
          '
      - name: Generate demo fixture
        run: ./examples/make-demo.sh
      - name: Container completes a real bisection and finds the culprit
        # Mount the workspace at its own path so the fixture's absolute file:
        # dependencies resolve inside the container. A clean exit proves install
        # and verification ran; the grep pins the identified culprit.
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" depbisect:ci \
            run --repo "$PWD/examples/demo/app" --base HEAD~1 --runs 3 \
            -- node test.js | tee bisect.log
          grep -q leftpad bisect.log
