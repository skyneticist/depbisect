<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#FF8A1E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF8A1E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="20" y="20" width="1240" height="600" rx="18" fill="none" stroke="#21262D" stroke-width="2"/>
  <!-- Accent bar -->
  <rect x="80" y="92" width="64" height="6" rx="3" fill="#FF8A1E"/>

  <!-- Terminal kicker -->
  <text x="80" y="150" font-family="monospace" font-size="24" fill="#6E7681">
    <tspan fill="#3FB950">$</tspan> depbisect run --base origin/main -- pnpm test
  </text>

  <!-- Title -->
  <text x="78" y="262" font-size="104" font-weight="800" letter-spacing="-2">
    <tspan fill="#F0F6FC">Dep</tspan><tspan fill="#FF8A1E">Bisect</tspan>
  </text>

  <!-- Tagline -->
  <text x="80" y="318" font-size="36" font-weight="600" fill="#FF8A1E">git bisect, but for dependency updates</text>

  <!-- Description -->
  <text x="80" y="362" font-size="25" fill="#8B949E">Find the smallest set of package.json changes that breaks your build — and prove it's minimal.</text>

  <!-- Motif: 43 changes narrowed to 1 culprit -->
  <text x="80" y="436" font-family="monospace" font-size="22" fill="#6E7681">43 changes analyzed</text>

  <g>
    <!-- 14 squares; index 9 is the culprit -->
    <rect x="80"  y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="124" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="168" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="212" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="256" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="300" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="344" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="388" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="432" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="476" y="448" width="38" height="38" rx="7" fill="#FF8A1E" filter="url(#soft)" opacity="0.55"/>
    <rect x="476" y="452" width="30" height="30" rx="6" fill="#FF8A1E" stroke="#FFB066" stroke-width="1.5"/>
    <rect x="520" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="564" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="608" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="652" y="452" width="30" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  </g>

  <!-- Result annotation -->
  <text x="716" y="475" font-family="monospace" font-size="23" fill="#FF8A1E">&#8594;  @acme/parser 3.8.1 &#8594; 3.9.0</text>

  <!-- Bottom meta strip -->
  <text x="80" y="566" font-family="monospace" font-size="20" fill="#6E7681">npm · pnpm · isolated git worktree · provably minimal</text>
  <text x="1200" y="566" text-anchor="end" font-family="monospace" font-size="20" fill="#484F58">github.com/skyneticist/depbisect</text>
</svg>
