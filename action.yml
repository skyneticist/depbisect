name: DepBisect
description: >-
  Find the smallest set of dependency updates (package.json, Cargo.toml,
  go.mod, or pyproject.toml) between two Git revisions that makes a command
  fail. Requires a
  checkout with enough history to contain the base revision (actions/checkout
  with fetch-depth: 0).
branding:
  icon: git-commit
  color: orange

inputs:
  base:
    description: Base revision to compare against (e.g. the PR base SHA).
    required: true
  command:
    description: >-
      Verification command. The action runs it via `bash -c`, so shell
      syntax works here (unlike the CLI, which takes an exact argv).
    required: true
  to:
    description: Target revision.
    required: false
    default: HEAD
  runs:
    description: Verification runs per candidate (flaky-test protection).
    required: false
    default: "1"
  jobs:
    description: >-
      Candidate trials to evaluate in parallel, each in its own worktree. The
      minimal set is identical at any value, but the verification command must
      be safe to run concurrently (no shared ports/files/state).
    required: false
    default: "1"
  pm:
    description: Package manager override (npm, pnpm, cargo, go, or uv). Default autodetect.
    required: false
    default: ""
  run-timeout:
    description: Timeout per verification run (Go duration, e.g. 10m).
    required: false
    default: "0s"
  install-timeout:
    description: Timeout per dependency install (Go duration, e.g. 15m).
    required: false
    default: "0s"
  overall-timeout:
    description: Timeout for the complete bisection (Go duration, e.g. 1h).
    required: false
    default: "0s"
  version:
    description: >-
      depbisect version to install. "source" builds the exact source bundled
      with this action; a tag like v0.1.0 installs that release.
    required: false
    default: source
  working-directory:
    description: Repository directory to operate on.
    required: false
    default: "."

outputs:
  outcome:
    description: Outcome code (minimal-set-found, not-reproduced, ...).
    value: ${{ steps.bisect.outputs.outcome }}
  exit-code:
    description: depbisect exit code (see README).
    value: ${{ steps.bisect.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version: stable
        cache: false

    - name: Install depbisect
      shell: bash
      env:
        DEPBISECT_VERSION: ${{ inputs.version }}
        DEPBISECT_ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ "$DEPBISECT_VERSION" = "source" ]; then
          output="$RUNNER_TEMP/depbisect"
          if [ "$RUNNER_OS" = "Windows" ]; then
            output="${output}.exe"
          fi
          (
            cd "$DEPBISECT_ACTION_PATH"
            go build -ldflags "-X main.version=${GITHUB_ACTION_REF:-source}" -o "$output" ./cmd/depbisect
          )
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        else
          go install "github.com/skyneticist/depbisect/cmd/depbisect@${DEPBISECT_VERSION}"
        fi

    - name: Run depbisect
      id: bisect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DB_BASE: ${{ inputs.base }}
        DB_TO: ${{ inputs.to }}
        DB_RUNS: ${{ inputs.runs }}
        DB_JOBS: ${{ inputs.jobs }}
        DB_PM: ${{ inputs.pm }}
        DB_RUN_TIMEOUT: ${{ inputs.run-timeout }}
        DB_INSTALL_TIMEOUT: ${{ inputs.install-timeout }}
        DB_OVERALL_TIMEOUT: ${{ inputs.overall-timeout }}
        DB_COMMAND: ${{ inputs.command }}
      run: |
        set -o pipefail
        report_json="depbisect-report.json"
        rm -f "$report_json" depbisect-report.md
        args=(
          run
          --base "$DB_BASE"
          --to "$DB_TO"
          --runs "$DB_RUNS"
          --jobs "$DB_JOBS"
          --run-timeout "$DB_RUN_TIMEOUT"
          --install-timeout "$DB_INSTALL_TIMEOUT"
          --overall-timeout "$DB_OVERALL_TIMEOUT"
        )
        if [ -n "$DB_PM" ]; then
          args+=(--pm "$DB_PM")
        fi
        set +e
        depbisect "${args[@]}" -- bash -c "$DB_COMMAND"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        outcome=unknown
        if [ -f "$report_json" ]; then
          outcome=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["outcome"])' "$report_json" || echo unknown)
        fi
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        # Only documented result codes are successful action outcomes.
        case "$code" in
          0|2|3|4|5) ;;
          *) exit "$code" ;;
        esac
